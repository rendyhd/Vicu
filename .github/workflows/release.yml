name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Create the draft release up-front so build-windows, build-macos, and
  # build-linux all see an existing release when they call
  # `electron-builder --publish always`. Without this, each runner races
  # to POST /repos/.../releases and whoever loses gets `422 already_exists`
  # and fails the job. Pre-release flag is set from the tag: vX.Y.Z-* is
  # treated as a pre-release, plain vX.Y.Z as a stable release.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping create."
            exit 0
          fi
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG=--prerelease
          else
            PRERELEASE_FLAG=
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --draft \
            $PRERELEASE_FLAG \
            --title "$TAG" \
            --notes ""

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build and publish
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Import the Developer ID cert into a temporary keychain when the secret
      # is present. Mirrors build-macos.yml. If BUILD_CERTIFICATE_BASE64 is unset
      # this step is skipped and the build falls back to an unsigned app.
      - name: Import signing certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - run: npm ci

      # Sign only if the cert secret is present (CSC_IDENTITY_AUTO_DISCOVERY
      # true), otherwise produce an unsigned build instead of failing. The
      # APPLE_* vars drive notarytool; electron-builder skips notarization when
      # the app is unsigned.
      - name: Build and publish
        run: npm run dist:mac:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          fi

      - name: Remove blockmap assets
        run: |
          for asset in dist/*.blockmap; do
            name=$(basename "$asset")
            gh release delete-asset "${{ github.ref_name }}" "$name" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # electron-builder.yml lists both arches under linux.target; we override
      # via the positional `AppImage:<arch>` target so each matrix runner only
      # builds and publishes its matrix arch. Without this override both
      # runners would build both arches AND publish them, leading to duplicate
      # asset-upload conflicts on the second runner.
      - name: Build and publish (${{ matrix.arch }})
        run: npm run build && npx electron-builder --linux AppImage:${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove blockmap assets
        run: |
          for asset in dist/*.blockmap; do
            [ -f "$asset" ] || continue
            name=$(basename "$asset")
            gh release delete-asset "${{ github.ref_name }}" "$name" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the draft release once every platform build has uploaded its assets.
  # The build jobs upload via `electron-builder --publish always` but leave the
  # release as the draft that create-release made, so nothing publishes it on its
  # own. This flips it to published only after all builds succeed — a failed
  # build leaves the release as a draft instead of shipping a partial release.
  # Stable tags (vX.Y.Z) become the "Latest" release; pre-release tags (vX.Y.Z-*)
  # publish with the pre-release flag.
  publish-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          fi
