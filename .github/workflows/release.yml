name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Create the draft release up-front so build-windows, build-macos, and
  # build-linux all see an existing release when they call
  # `electron-builder --publish always`. Without this, each runner races
  # to POST /repos/.../releases and whoever loses gets `422 already_exists`
  # and fails the job. Pre-release flag is set from the tag: vX.Y.Z-* is
  # treated as a pre-release, plain vX.Y.Z as a stable release.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping create."
            exit 0
          fi
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG=--prerelease
          else
            PRERELEASE_FLAG=
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --draft \
            $PRERELEASE_FLAG \
            --title "$TAG" \
            --notes ""

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build and publish
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build and publish
        run: npm run dist:mac:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Remove blockmap assets
        run: |
          for asset in dist/*.blockmap; do
            name=$(basename "$asset")
            gh release delete-asset "${{ github.ref_name }}" "$name" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # electron-builder.yml lists both arches under linux.target; we override
      # via the positional `AppImage:<arch>` target so each matrix runner only
      # builds and publishes its matrix arch. Without this override both
      # runners would build both arches AND publish them, leading to duplicate
      # asset-upload conflicts on the second runner.
      - name: Build and publish (${{ matrix.arch }})
        run: npm run build && npx electron-builder --linux AppImage:${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove blockmap assets
        run: |
          for asset in dist/*.blockmap; do
            [ -f "$asset" ] || continue
            name=$(basename "$asset")
            gh release delete-asset "${{ github.ref_name }}" "$name" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
