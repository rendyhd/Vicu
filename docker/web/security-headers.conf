# The headers every page and file of the web version is served with. One file, included wherever
# nginx would otherwise drop them (an add_header in a location replaces the server's own), and read
# by scripts/ui-verify/web-server.mjs so the harness tests the page under the same policy.
#
# The policy is the desktop window's (src/renderer/index.html) plus what only matters on a website:
# nothing may frame the app, post a form elsewhere or change the base address, and no plugin runs.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Sent only to a visitor who came over HTTPS (the value is empty otherwise, and nginx then leaves
# the header out); see default.conf.template.
add_header Strict-Transport-Security $vicu_hsts always;
